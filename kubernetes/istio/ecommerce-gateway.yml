# Istio Gateway: membuka pintu masuk HTTP dari luar cluster melalui Istio Ingress Gateway
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  # Nama Gateway yang dirujuk oleh VirtualService
  name: ecommerce-gateway
  # Namespace aplikasi
  namespace: ecommerce
spec:
  # Pakai Pod Istio Ingress Gateway bawaan (label istio=ingressgateway)
  selector:
    istio: ingressgateway
  servers:
    - port:
        # Terima trafik HTTP pada port 80
        number: 80
        name: http
        protocol: HTTP
      # Terima request untuk host apa pun
      hosts:
        - "*"

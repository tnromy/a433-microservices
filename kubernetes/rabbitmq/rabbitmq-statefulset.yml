# StatefulSet untuk menjalankan RabbitMQ server (message broker)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  # Nama StatefulSet RabbitMQ
  name: rabbitmq
  # Namespace aplikasi
  namespace: ecommerce
  labels:
    app: rabbitmq
spec:
  # Service yang mengatur identitas jaringan Pod StatefulSet
  serviceName: rabbitmq
  # Jumlah replika RabbitMQ
  replicas: 1
  # Pilih Pod yang dikelola berdasarkan label
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Image RabbitMQ beserta Management UI dari Docker Hub
          image: rabbitmq:3.11-management
          ports:
            # Port AMQP untuk komunikasi antar service
            - name: amqp
              containerPort: 5672
            # Port Management UI
            - name: management
              containerPort: 15672
          env:
            # Username default RabbitMQ diambil dari Secret
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_USER
            # Password default RabbitMQ diambil dari Secret
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_PASS
          # Pod dianggap siap bila port AMQP sudah menerima koneksi
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            # Simpan data RabbitMQ (queue dan message) secara persisten
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  # Buat PersistentVolumeClaim otomatis untuk setiap Pod RabbitMQ
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        # Volume hanya bisa di-mount read-write oleh satu node
        accessModes: ["ReadWriteOnce"]
        # Besar penyimpanan yang diminta
        resources:
          requests:
            storage: 1Gi

# Secret berisi kredensial user RabbitMQ (user "guest" bawaan hanya boleh login dari localhost)
apiVersion: v1
kind: Secret
metadata:
  # Nama Secret yang dirujuk oleh RabbitMQ, order service, dan shipping service
  name: rabbitmq-secret
  # Namespace aplikasi
  namespace: ecommerce
  labels:
    app: rabbitmq
# Tipe Opaque: pasangan key-value bebas
type: Opaque
data:
  # Username RabbitMQ ("ecommerce") dalam bentuk base64
  RABBITMQ_USER: ZWNvbW1lcmNl
  # Password RabbitMQ ("ecommerce123") dalam bentuk base64
  RABBITMQ_PASS: ZWNvbW1lcmNlMTIz

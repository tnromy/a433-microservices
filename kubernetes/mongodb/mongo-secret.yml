# Secret untuk menyimpan kredensial root MongoDB
apiVersion: v1
kind: Secret
metadata:
  # Nama Secret yang dirujuk oleh StatefulSet MongoDB dan Deployment backend
  name: mongo-secret
  labels:
    app: mongo
# Tipe Opaque: Secret berisi pasangan key-value bebas
type: Opaque
data:
  # Username root MongoDB ("admin") dalam bentuk base64
  MONGO_ROOT_USERNAME: YWRtaW4=
  # Password root MongoDB ("supersecretpassword") dalam bentuk base64
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==

# Continuous Integration untuk backend Karsa Jobs (branch karsajobs)
name: CI karsajobs

# Jalankan pipeline setiap ada push ke branch karsajobs
on:
  push:
    branches: [karsajobs]
  workflow_dispatch:

# Izin GITHUB_TOKEN: baca isi repo dan tulis ke GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  # Langkah 1: install hadolint lalu periksa Dockerfile
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      # Ambil source code dari repository
      - uses: actions/checkout@v4
      # Unduh binary hadolint dan jadikan executable
      - name: Install hadolint
        run: |
          sudo wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      # Jalankan hadolint terhadap Dockerfile
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  # Langkah 2: jalankan unit test backend
  test-app:
    runs-on: ubuntu-latest
    steps:
      # Ambil source code dari repository
      - uses: actions/checkout@v4
      # Siapkan Go versi yang sama dengan Dockerfile (golang:1.15)
      - uses: actions/setup-go@v5
        with:
          go-version: "1.15"
      # Jalankan unit test (-short melewati integration test yang butuh MongoDB)
      - name: Run unit test
        run: go test -v -short --count=1 $(go list ./...)

  # Langkah 3: build dan push image ke GitHub Packages (setelah lint dan test lolos)
  build-app-karsajobs:
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, test-app]
    steps:
      # Ambil source code dari repository
      - uses: actions/checkout@v4
      # Jalankan script build & push; token login GHCR diambil dari GITHUB_TOKEN
      - name: Build and push image
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./build_push_image_karsajobs.sh

# Continuous Integration untuk frontend Karsa Jobs (branch karsajobs-ui)
name: CI karsajobs-ui

# Jalankan pipeline setiap ada push ke branch karsajobs-ui
on:
  push:
    branches: [karsajobs-ui]
  workflow_dispatch:

# Izin GITHUB_TOKEN: baca isi repo dan tulis ke GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  # Langkah 1: install hadolint lalu periksa Dockerfile
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      # Ambil source code dari repository
      - uses: actions/checkout@v4
      # Unduh binary hadolint dan jadikan executable
      - name: Install hadolint
        run: |
          sudo wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      # Jalankan hadolint terhadap Dockerfile
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  # Langkah 2: build dan push image ke GitHub Packages (setelah lint lolos)
  build-app-karsajobs-ui:
    runs-on: ubuntu-latest
    needs: [lint-dockerfile]
    steps:
      # Ambil source code dari repository
      - uses: actions/checkout@v4
      # Jalankan script build & push; token login GHCR diambil dari GITHUB_TOKEN
      - name: Build and push image
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./build_push_image_karsajobs_ui.sh
